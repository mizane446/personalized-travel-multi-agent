_config_version: 51
model:
  provider: custom
  default: gpt-6-sol
  base_url: https://ccgoai.club/v1
agent:
  reasoning_effort: none
  max_turns: 30
plugins:
  enabled: [web-doubao, travel-enhancements]
web:
  search_backend: doubao
tools:
  tool_search:
    enabled: "off"
platform_toolsets:
  cli: [search, travel]
delegation:
  provider: custom
  model: gpt-6-sol
  base_url: https://ccgoai.club/v1
  max_concurrent_children: 3
  max_spawn_depth: 1
  inherit_mcp_toolsets: false
  oneshot_max_children: 3
  child_timeout_seconds: 120
  reasoning_effort: none
auxiliary:
  travel_review:
    provider: custom
    model: gpt-6-sol
    base_url: https://ccgoai.club/v1
    reasoning_effort: none
    timeout: 45
  title_generation:
    enabled: false
